server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # MapLibre's explicit Vite worker asset uses the .mjs extension. Alpine
    # nginx otherwise serves it as application/octet-stream, which browsers
    # reject for a module Worker and leaves every GeoJSON source loading.
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
